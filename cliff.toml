# git-cliff configuration
# Generated initially with `git cliff --init` and adapted for this repository history.

[changelog]
header_marker = "<!-- git-cliff: end of header -->"
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

<!-- git-cliff: end of header -->

"""
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}
{% for entry in commits | commit_groups(groups=commit_parsers_groups) %}
### {{ entry.group | striptags | trim | upper_first }}
{% for commit in entry.commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}
{%- endfor %}
{% endfor -%}
"""
trim = true
render_always = true

[git]
conventional_commits = true
filter_unconventional = true
require_conventional = false
split_commits = false
protect_breaking_commits = true
commit_parsers = [
    { message = '^Merge', skip = true },
    { message = '^(docs?|test|style|chore|ci|build|config|refactor)(\([^)]*\))?!?:', skip = true },
    { message = '^feat', group = 'Added' },
    { message = '^fix', group = 'Fixed' },
    { message = '^perf', group = 'Changed' },
    { message = '^(remove|revert)', group = 'Removed' },
]
filter_commits = true
fail_on_unmatched_commit = false
link_parsers = []
use_branch_tags = false
topo_order = false
topo_order_commits = true
sort_commits = 'oldest'
recurse_submodules = false
