name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: code/pnpm-lock.yaml
      - run: corepack enable
      - run: make install
      - run: make format-check
      - run: make lint
      - run: make typecheck

  runtime:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: code/pnpm-lock.yaml
      - run: corepack enable
      - run: make install
      - run: make test
      - run: make build
      - run: make pack-check

  peer-compatibility:
    name: NestJS ${{ matrix.nestjs }} compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - nestjs: 11
            nestjs_version: 11.2.3
            nestjs_cache_manager_version: 3.1.3
            cache_manager_version: 6.4.3
          - nestjs: 12
            nestjs_version: 12.0.1
            nestjs_cache_manager_version: 12.0.0
            cache_manager_version: 7.2.9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: code/pnpm-lock.yaml
      - run: corepack enable
      - run: make install
      - run: make pack-check
        env:
          NESTJS_VERSION: ${{ matrix.nestjs_version }}
          NESTJS_CACHE_MANAGER_VERSION: ${{ matrix.nestjs_cache_manager_version }}
          CACHE_MANAGER_VERSION: ${{ matrix.cache_manager_version }}
