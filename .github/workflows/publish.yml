name: Publish to npm

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  select-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select and validate the latest stable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"

          tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
          version="${tag#v}"
          test "$tag" = "v$version"

          git fetch origin main --tags --force
          git rev-parse "$tag^{commit}" >/dev/null
          git merge-base --is-ancestor "$tag^{commit}" origin/main
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check out selected release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.tag }}
          persist-credentials: false

      - name: Check version can be published
        id: version-check
        uses: jfrz38/check-version-change@712f1f323f716ff1241b4fdd99e698d56daf462d # v1.4.0
        with:
          file-path: code/package.json
          package-name: '@jfrz38/nestjs-cache-proxy'
          compare-source: registry
          registry: npm
          fail-on-unchanged: true
          fail-on-not-higher: true

      - name: Verify selected tag matches package version
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.version-check.outputs.local-version }}
        shell: bash
        run: test "$TAG" = "v$VERSION"

  publish:
    needs: select-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.select-release.outputs.tag }}
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.3.4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: code/pnpm-lock.yaml

      - name: Install dependencies
        run: make install

      - name: Validate tagged release candidate
        run: make release-check

      - name: Verify npm package contents
        run: pnpm --dir code publish --dry-run --access public --no-git-checks

      - name: Publish @jfrz38/nestjs-cache-proxy
        run: pnpm --dir code publish --access public --provenance --no-git-checks
