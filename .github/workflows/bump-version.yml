name: Bump Version

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version component to bump
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 0

      - name: Bump version
        uses: jfrz38/auto-version-bump-action@72e195a978a7b6b433b39bfef52d335b6fe609b6 # v0.3.0
        with:
          bump: ${{ inputs.bump }}
          strategy: npm
          version-file: code/package.json
          base-branch: develop
          github-token: ${{ github.token }}
          commit-message: 'chore: bump version to {new-version}'
          pr-title: 'chore: bump version to {new-version}'
          pr-body: 'Bumps @jfrz38/nestjs-cache-proxy from {current-version} to {next-version} using a {bump} release bump.'
