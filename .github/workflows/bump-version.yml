name: Bump Version

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version component to bump
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 0

      - name: Verify latest release belongs to develop
        shell: bash
        run: |
          set -euo pipefail
          latest_tag="$(git tag --list 'v[0-9]*' --sort=-version:refname | sed -n '1p')"
          test -n "$latest_tag"

          if ! git merge-base --is-ancestor "$latest_tag" HEAD; then
            echo "::error::Latest release $latest_tag is not an ancestor of develop. Merge main back into develop with a merge commit before bumping the version."
            exit 1
          fi

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.3.4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: code/pnpm-lock.yaml

      - name: Install dependencies
        run: make install

      - name: Bump version
        uses: jfrz38/auto-version-bump-action@7a76804803c0ae5dc7c5d8d1ac7bfcf4fbbb4d6f # v0.4.0
        with:
          bump: ${{ inputs.bump }}
          changelog: git-cliff
          strategy: npm
          version-file: code/package.json
          base-branch: develop
          github-token: ${{ github.token }}
          commit-message: 'chore: bump version to {next-version}'
          pr-title: 'chore: bump version to {next-version}'
          pr-body: 'Bumps @jfrz38/nestjs-cache-proxy from {current-version} to {next-version} using a {bump} release bump.'
          pre-commit-commands: |
            make format
            make pack-check
