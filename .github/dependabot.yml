version: 2
updates:
  - package-ecosystem: npm
    directory: /code
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    versioning-strategy: increase
    commit-message:
      prefix: '[Dependency Update]'
    ignore:
      - dependency-name: typescript
        versions:
          - '>=7.0.0'
    groups:
      npm-development:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: '[CI Update]'
    groups:
      github-actions:
        patterns:
          - '*'
